spring.application.name=payment-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:paymentdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.port=8081
server.servlet.context-path=/app
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.main.banner-mode=off
logging.level.root=warn
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
info.app.name=Payment Service
info.app.description=Payment Management Microservice
info.app.version=1.0.0
# Paystack Configuration
paystack.secret-key=${PAYSTACK_SECRET_KEY:sk_test_xxx}
paystack.base-url=https://api.paystack.co
paystack.callback-url=https://yourdomain.com/api/v1/payments/callback