info.app.name=Patient Service
spring.application.name=patient-service
info.developer.name=Gboluwaga
# Database Configuration (with default fallbacks)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/patientdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:SpringBoot@2026}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Port configuration
server.port=8080
# Path configuration
server.servlet.context-path=/devapp/
# SWAGGER
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=api/swagger-ui.html
# Turn off Spring banner
spring.main.banner-mode=off
# Reduce logging level
logging.level.root=warn
#logging.level.com.elroi.patientservice=DEBUG
# SECURITY (with default fallbacks)
spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:password}
# ACTUATOR CONFIGURATION
springdoc.show-actuator=true
info.app.description=Patient Management Microservice
info.app.version=1.0.0
management.endpoints.web.exposure.exclude=*
management.endpoint.health.show-details=always
management.health.db.enabled=true
spring.banner.mode=off