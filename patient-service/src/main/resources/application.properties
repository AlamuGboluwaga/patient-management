spring.application.name=patient-service
#Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/patientdb
spring.datasource.username=postgres
spring.datasource.password=SpringBoot@2026
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
#Port configuration
server.port=8080
#Path configuration
server.servlet.context-path=/app/
# SWAGGER
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
#Turn off Spring banner
spring.main.banner-mode=off
#Reduce logging level, St logging level to warn
logging.level.root=warn
#SECURITY
spring.security.user.name=admin
spring.security.user.password=password
springdoc.show-actuator=true
# ACTUATOR CONFIGURATION
info.app.name=Patient Service
info.app.description=Patient Management Microservice
info.app.version=1.0.0
info.developer.name=Gboluwaga
# Expose endpoints over HTTP (use "*" to expose all, or list specific ones like "health,info,metrics,env")
management.endpoints.web.exposure.include=health,info,metrics
# Show detailed health status (never, when-authorized, or always)
management.endpoint.health.show-details=always
# Include database / component details in health check
management.health.db.enabled=true